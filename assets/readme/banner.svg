<g opacity="0"><text x="56" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#22D3EE">ebrahim@wazuh</tspan><tspan fill="#64748B">:~$ </tspan><tspan fill="#E2E8F0">hydra -l root -P rockyou.txt ssh://10.10.10.20</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/></g>
