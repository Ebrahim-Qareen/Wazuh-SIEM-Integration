<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/>
<rect x="193.7" y="192" width="9" height="18" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/></rect>
</g>
