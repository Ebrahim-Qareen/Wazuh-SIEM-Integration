<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Wazuh SIEM Integration Lab — Attack it · See it · Write the rule · Tell the analyst what to do">
<title>Wazuh SIEM Integration Lab — Attack it · See it · Write the rule · Tell the analyst what to do</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1E2A45" stroke-width="1"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="290" rx="16" fill="url(#bg)"/>
<rect width="1200" height="290" rx="16" fill="url(#grid)" opacity="0.55"/>
<rect x="0" y="0" width="6" height="290" rx="3" fill="url(#accent)"/>
<rect x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity="0.35"><animate attributeName="y" from="0" to="290" dur="6s" repeatCount="indefinite"/></rect>
<text x="56" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#E2E8F0">Wazuh SIEM Integration Lab</text>
