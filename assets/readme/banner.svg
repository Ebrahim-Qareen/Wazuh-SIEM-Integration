<g opacity="0"><text x="56" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#22D3EE">ebrahim@wazuh</tspan><tspan fill="#64748B">:~$ </tspan><tspan fill="#E2E8F0">tail -f /var/ossec/logs/alerts/alerts.json | jq .rule.id</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/></g>
<g opacity="0"><text x="56" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#4ADE80">→ 100110  level 10  T1110.0  firewall-drop</text><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/><text x="56" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#22D3EE">ebrahim@wazuh</tspan><tspan fill="#64748B">:~$ </tspan></text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/>
<rect x="193.7" y="192" width="9" height="18" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(950,70) scale(4.6)" opacity="0.95"><path d="M14 2l10 4v7c0 7-5 11-10 13C9 24 4 20 4 13V6z" fill="none" stroke="#22D3EE" stroke-width="2"/><path d="M9.5 14l3 3 6-7" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
