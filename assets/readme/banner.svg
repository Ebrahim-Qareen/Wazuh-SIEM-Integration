<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Wazuh SIEM Integration Lab — Attack it · See it · Write the rule · Tell the analyst what to do">
<title>Wazuh SIEM Integration Lab — Attack it · See it · Write the rule · Tell the analyst what to do</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131720"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#252b38" stroke-width="1"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="290" rx="16" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="16" fill="none" stroke="#252b38" stroke-width="1.5"/>
